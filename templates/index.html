<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <h1>{{ titulo }}</h1>

    <p>Sistema de Monitoramento e Gerenciamento de CTOs</p>

    <button id="btnNovaCTO">➕ Nova CTO</button>

    <!-- Modal para criar CTO -->
    <div id="modalCTO" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalCTOTitulo">Criar Nova CTO</h2>
            
            <div>
                <h3>Dados da CTO</h3>
                <div class="form-group">
                    <label>Localização:</label>
                    <input type="text" id="inputLocalizacao" placeholder="Localização" required>
                </div>
                <div class="form-group">
                    <label>Quantidade de Portas:</label>
                    <select id="inputQuantidadePortas" required>
                        <option value="">Selecione a quantidade</option>
                        <option value="8">8 Portas</option>
                        <option value="16">16 Portas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Localização no mapa (clique para marcar):</label>
                    <div id="miniMapaCTO" style="height: 250px; border-radius: 6px; border: 1px solid #334155;"></div>
                    <input type="hidden" id="inputLatitude">
                    <input type="hidden" id="inputLongitude">
                </div>
            </div>

            <div class="modal-buttons">
                <button id="btnCriarCTO">✓ Criar CTO</button>
                <button class="btn-secondary" id="btnCancelar">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal para adicionar porta -->
    <div id="modalPorta" class="modal">
        <div class="modal-content">
            <span class="close" id="closePorta">&times;</span>
            <h2 id="modalPortaTitulo">Adicionar Porta</h2>
            
            <div id="ctoInfo" style="background: rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 6px; margin-bottom: 20px; border-left: 3px solid #3b82f6;">
                <p style="margin: 0;"><strong>CTO:</strong> <span id="ctoNomeInfo"></span></p>
                <p style="margin: 5px 0 0 0;"><strong>Localização:</strong> <span id="ctoLocalizacaoInfo"></span></p>
            </div>
            
            <div>
                <div class="form-group">
                    <label>Porta:</label>
                    <select id="inputPorta">
                        <option value="">Selecione uma porta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="inputStatus">
                        <option value="">Selecione um status</option>
                        <option value="🟢 Ocupada">🟢 Ocupada</option>
                        <option value="⚪ Livre">⚪ Livre</option>
                        <option value="🔴 Reservada">🔴 Reservada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cliente:</label>
                    <input type="text" id="inputCliente" placeholder="Cliente">
                </div>
                <div class="form-group">
                    <label>Plano:</label>
                    <select id="inputPlano">
                        <option value="">Selecione um plano</option>
                        <option value="100 Mb">100 Mb</option>
                        <option value="200 Mb">200 Mb</option>
                        <option value="300 Mb">300 Mb</option>
                        <option value="400 Mb">400 Mb</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observação:</label>
                    <input type="text" id="inputObservacao" placeholder="Roteador">
                </div>
            </div>

            <div class="modal-buttons">
                <button id="btnAdicionarPorta">✓ Adicionar Porta</button>
                <button class="btn-secondary" id="btnFecharPorta">✕ Fechar</button>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button type="button" class="nav-tab active" id="navTabCTOs">📋 CTOs</button>
        <button type="button" class="nav-tab" id="navTabClientes">👥 Clientes</button>
        <button type="button" class="nav-tab" id="navTabMapa">🗺️ Mapa</button>
    </div>

    <div id="secaoCTOs">
        <h2>CTOs Criadas</h2>
        <div id="listaCTOs">
            <p style="color: #999;">Nenhuma CTO criada ainda...</p>
        </div>
    </div>

    <div id="secaoClientes" style="display: none;">
        <h2>Clientes</h2>
        <input type="text" id="filtroClientes" class="filtro-clientes" placeholder="Filtrar por nome do cliente">
        <div id="listaClientes">
            <p style="color: #999;">Nenhum cliente cadastrado ainda...</p>
        </div>
    </div>

    <div id="secaoMapa" style="display: none;">
        <h2>Mapa das CTOs</h2>
        <p id="mapaMensagem" style="display: none; color: #94a3b8;">Nenhuma CTO com localização marcada no mapa ainda.</p>
        <div id="mapaCTOs" class="mapa-container"></div>
    </div>

    <script>
        let ctoAtualId = null;
        let ctoAtualQuantidade = 0;
        let ctoEditandoId = null;
        let portaEditandoNumero = null;
        let ctosCache = [];
        let miniMapa = null;
        let miniMapaMarker = null;
        let mapaPrincipal = null;
        let mapaPrincipalMarkers = null;

        // Adiciona as camadas base (Mapa/Satélite) com controle de alternância em um mapa Leaflet
        function adicionarCamadasBase(mapa) {
            const camadaRua = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            });

            const camadaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
            });

            camadaRua.addTo(mapa);

            L.control.layers({
                "🗺️ Mapa": camadaRua,
                "🛰️ Satélite": camadaSatelite
            }).addTo(mapa);
        }
        
        // Elementos modais
        const modalCTO = document.getElementById("modalCTO");
        const modalPorta = document.getElementById("modalPorta");
        const closeBtnCTO = document.querySelector(".close");
        const closeBtnPorta = document.getElementById("closePorta");
        const btnNovaCTO = document.getElementById("btnNovaCTO");
        const btnAdicionarPorta = document.getElementById("btnAdicionarPorta");
        const btnCriarCTO = document.getElementById("btnCriarCTO");
        const btnCancelar = document.getElementById("btnCancelar");
        const btnFecharPorta = document.getElementById("btnFecharPorta");
        const inputQuantidadePortas = document.getElementById("inputQuantidadePortas");
        const inputPorta = document.getElementById("inputPorta");

        // Atualizar select de portas conforme a quantidade selecionada
        inputQuantidadePortas.onchange = function() {
            const quantidade = this.value;
            inputPorta.innerHTML = '<option value="">Selecione uma porta</option>';
            
            if (quantidade === "8") {
                for (let i = 1; i <= 8; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            } else if (quantidade === "16") {
                for (let i = 1; i <= 16; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            }
        }

        // Abrir modal de criar CTO
        btnNovaCTO.onclick = function() {
            ctoEditandoId = null;
            document.getElementById("modalCTOTitulo").textContent = "Criar Nova CTO";
            btnCriarCTO.textContent = "✓ Criar CTO";
            document.getElementById("inputLocalizacao").value = "";
            document.getElementById("inputQuantidadePortas").value = "";
            document.getElementById("inputLatitude").value = "";
            document.getElementById("inputLongitude").value = "";
            inputPorta.innerHTML = '<option value="">Selecione uma porta</option>';
            modalCTO.style.display = "block";
            inicializarMiniMapa(null, null);
        }

        // Fechar modais
        closeBtnCTO.onclick = function() {
            ctoEditandoId = null;
            modalCTO.style.display = "none";
        }
        
        closeBtnPorta.onclick = function() {
            portaEditandoNumero = null;
            inputPorta.disabled = false;
            modalPorta.style.display = "none";
        }

        btnCancelar.onclick = function() {
            ctoEditandoId = null;
            modalCTO.style.display = "none";
        }
        
        btnFecharPorta.onclick = function() {
            portaEditandoNumero = null;
            inputPorta.disabled = false;
            modalPorta.style.display = "none";
        }

        // Criar ou editar CTO
        btnCriarCTO.onclick = async function() {
            const localizacao = document.getElementById("inputLocalizacao").value.trim();
            const quantidadePortas = document.getElementById("inputQuantidadePortas").value;
            const latitude = document.getElementById("inputLatitude").value;
            const longitude = document.getElementById("inputLongitude").value;
            
            if (!localizacao) {
                alert("Localização é obrigatória!");
                return;
            }

            if (!quantidadePortas) {
                alert("Quantidade de portas é obrigatória!");
                return;
            }

            try {
                const editando = ctoEditandoId !== null;
                const url = editando ? '/editar-cto' : '/nova-cto';
                const body = editando
                    ? { cto_id: ctoEditandoId, localizacao: localizacao, quantidade_portas: quantidadePortas, latitude: latitude, longitude: longitude }
                    : { localizacao: localizacao, quantidade_portas: quantidadePortas, portas: [], latitude: latitude, longitude: longitude };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (response.ok) {
                    modalCTO.style.display = "none";
                    ctoEditandoId = null;
                    carregarCTOs();
                } else {
                    alert(editando ? 'Erro ao editar CTO' : 'Erro ao criar nova CTO');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro na comunicação com o servidor');
            }
        }

        // Abrir modal de editar CTO
        function abrirModalEditarCTO(ctoId, ctoLocalizacao, ctoQuantidade, ctoLatitude, ctoLongitude) {
            ctoEditandoId = ctoId;
            document.getElementById("modalCTOTitulo").textContent = "Editar CTO";
            btnCriarCTO.textContent = "✓ Salvar Alterações";
            document.getElementById("inputLocalizacao").value = ctoLocalizacao;
            document.getElementById("inputQuantidadePortas").value = ctoQuantidade;
            document.getElementById("inputLatitude").value = "";
            document.getElementById("inputLongitude").value = "";
            modalCTO.style.display = "block";

            const lat = parseFloat(ctoLatitude);
            const lng = parseFloat(ctoLongitude);
            inicializarMiniMapa(isNaN(lat) ? null : lat, isNaN(lng) ? null : lng);
        }

        // Inicializar/atualizar o mini-mapa do modal de CTO
        function inicializarMiniMapa(lat, lng) {
            const temCoordenadas = lat !== null && lng !== null;
            const latInicial = temCoordenadas ? lat : -14.235;
            const lngInicial = temCoordenadas ? lng : -51.9253;
            const zoomInicial = temCoordenadas ? 16 : 4;

            if (!miniMapa) {
                miniMapa = L.map('miniMapaCTO').setView([latInicial, lngInicial], zoomInicial);
                adicionarCamadasBase(miniMapa);

                miniMapa.on('click', function(e) {
                    definirMarcadorMiniMapa(e.latlng.lat, e.latlng.lng);
                });
            } else {
                miniMapa.setView([latInicial, lngInicial], zoomInicial);
            }

            if (miniMapaMarker) {
                miniMapa.removeLayer(miniMapaMarker);
                miniMapaMarker = null;
            }

            if (temCoordenadas) {
                definirMarcadorMiniMapa(lat, lng);
            } else {
                document.getElementById("inputLatitude").value = "";
                document.getElementById("inputLongitude").value = "";
            }

            setTimeout(() => miniMapa.invalidateSize(), 200);
        }

        // Colocar/mover o marcador no mini-mapa e preencher os campos ocultos
        function definirMarcadorMiniMapa(lat, lng) {
            if (miniMapaMarker) {
                miniMapaMarker.setLatLng([lat, lng]);
            } else {
                miniMapaMarker = L.marker([lat, lng]).addTo(miniMapa);
            }
            document.getElementById("inputLatitude").value = lat;
            document.getElementById("inputLongitude").value = lng;
        }

        // Excluir CTO
        async function excluirCTO(ctoId) {
            if (!confirm("Tem certeza que deseja excluir esta CTO?")) {
                return;
            }

            try {
                const response = await fetch('/excluir-cto', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ cto_id: ctoId })
                });

                if (response.ok) {
                    carregarCTOs();
                } else {
                    alert('Erro ao excluir CTO');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro na comunicação com o servidor');
            }
        }

        // Abrir modal de adicionar porta
        function abrirModalAdicionarPorta(ctoId, ctoNome, ctoLocalizacao, ctoQuantidade) {
            ctoAtualId = ctoId;
            ctoAtualQuantidade = parseInt(ctoQuantidade);
            portaEditandoNumero = null;
            
            document.getElementById("modalPortaTitulo").textContent = "Adicionar Porta";
            btnAdicionarPorta.textContent = "✓ Adicionar Porta";
            document.getElementById("ctoNomeInfo").textContent = ctoNome;
            document.getElementById("ctoLocalizacaoInfo").textContent = ctoLocalizacao;
            
            // Limpar campos
            document.getElementById("inputPorta").value = "";
            document.getElementById("inputStatus").value = "";
            document.getElementById("inputCliente").value = "";
            document.getElementById("inputPlano").value = "";
            document.getElementById("inputObservacao").value = "";
            
            // Preencher select de portas baseado na quantidade
            inputPorta.innerHTML = '<option value="">Selecione uma porta</option>';
            if (ctoAtualQuantidade === 8) {
                for (let i = 1; i <= 8; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            } else if (ctoAtualQuantidade === 16) {
                for (let i = 1; i <= 16; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            }
            inputPorta.disabled = false;
            
            modalPorta.style.display = "block";
        }

        // Abrir modal de editar porta
        function abrirModalEditarPorta(ctoId, ctoNome, ctoLocalizacao, ctoQuantidade, numero, status, cliente, plano, observacao) {
            ctoAtualId = ctoId;
            ctoAtualQuantidade = parseInt(ctoQuantidade);
            portaEditandoNumero = numero;
            
            document.getElementById("modalPortaTitulo").textContent = "Editar Porta";
            btnAdicionarPorta.textContent = "✓ Salvar Alterações";
            document.getElementById("ctoNomeInfo").textContent = ctoNome;
            document.getElementById("ctoLocalizacaoInfo").textContent = ctoLocalizacao;
            
            // Preencher select de portas baseado na quantidade
            inputPorta.innerHTML = '<option value="">Selecione uma porta</option>';
            if (ctoAtualQuantidade === 8) {
                for (let i = 1; i <= 8; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            } else if (ctoAtualQuantidade === 16) {
                for (let i = 1; i <= 16; i++) {
                    inputPorta.innerHTML += `<option value="${i}">Porta ${i}</option>`;
                }
            }
            
            document.getElementById("inputPorta").value = numero;
            inputPorta.disabled = false;
            document.getElementById("inputStatus").value = status;
            document.getElementById("inputCliente").value = cliente === "-" ? "" : cliente;
            document.getElementById("inputPlano").value = plano === "-" ? "" : plano;
            document.getElementById("inputObservacao").value = observacao === "-" ? "" : observacao;
            
            modalPorta.style.display = "block";
        }

        // Adicionar ou editar porta da CTO
        btnAdicionarPorta.onclick = async function() {
            const porta = document.getElementById("inputPorta").value;
            const status = document.getElementById("inputStatus").value;
            const cliente = document.getElementById("inputCliente").value;
            const plano = document.getElementById("inputPlano").value;
            const observacao = document.getElementById("inputObservacao").value;

            if (!porta || !status) {
                alert("Porta e Status são obrigatórios!");
                return;
            }

            try {
                const editando = portaEditandoNumero !== null;
                const url = editando ? '/editar-porta' : '/adicionar-porta';

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cto_id: ctoAtualId,
                        numero_original: editando ? portaEditandoNumero : porta,
                        numero: porta,
                        status: status,
                        cliente: cliente || "-",
                        plano: plano || "-",
                        observacao: observacao || "-"
                    })
                });

                if (response.ok) {
                    // Limpar campos
                    document.getElementById("inputPorta").value = "";
                    document.getElementById("inputStatus").value = "";
                    document.getElementById("inputCliente").value = "";
                    document.getElementById("inputPlano").value = "";
                    document.getElementById("inputObservacao").value = "";
                    inputPorta.disabled = false;
                    portaEditandoNumero = null;
                    modalPorta.style.display = "none";
                    
                    carregarCTOs();
                    alert(editando ? "Porta atualizada com sucesso!" : "Porta adicionada com sucesso!");
                } else {
                    alert(editando ? 'Erro ao editar porta' : 'Erro ao adicionar porta');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro na comunicação com o servidor');
            }
        }

        // Excluir porta da CTO
        async function excluirPorta(ctoId, numero) {
            if (!confirm("Tem certeza que deseja excluir esta porta?")) {
                return;
            }

            try {
                const response = await fetch('/excluir-porta', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ cto_id: ctoId, numero: numero })
                });

                if (response.ok) {
                    carregarCTOs();
                } else {
                    alert('Erro ao excluir porta');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro na comunicação com o servidor');
            }
        }

        // Função para copiar ID
        function copiarID(id) {
            navigator.clipboard.writeText(id).then(() => {
                alert("ID copiado: " + id);
            }).catch(err => {
                console.error('Erro ao copiar:', err);
                alert('Erro ao copiar ID');
            });
        }

        // Carregar CTOs ao iniciar
        async function carregarCTOs() {
            try {
                const response = await fetch('/listar-ctos');
                const data = await response.json();
                ctosCache = data.ctos;
                
                const container = document.getElementById('listaCTOs');
                if (data.ctos.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">Nenhuma CTO criada ainda...</p>';
                } else {
                    container.innerHTML = data.ctos.map(cto => `
                        <div class="cto-section" id="cto-${cto.id}">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                <div>
                                    <div class="cto-header">${cto.nome}</div>
                                    <div style="color: #93c5fd; font-size: 0.9em; margin-top: 5px;">
                                        <strong>ID:</strong> <span id="id-${cto.id}" style="font-family: monospace; background: rgba(59, 130, 246, 0.2); padding: 4px 8px; border-radius: 4px;">${cto.id}</span>
                                        <button onclick="copiarID('${cto.id}')" style="background: #3b82f6; padding: 4px 12px; font-size: 0.85em; margin-left: 8px;">📋 Copiar</button>
                                    </div>
                                </div>
                            </div>
                            <div style="color: #cbd5e1; margin-bottom: 12px; padding: 10px; background: rgba(59, 130, 246, 0.05); border-left: 3px solid #3b82f6; border-radius: 4px;">
                                📍 <strong>Localização:</strong> ${cto.localizacao} | 🔌 <strong>Portas:</strong> ${cto.quantidade_portas} | 📅 <strong>Criada:</strong> ${cto.data_criacao}
                            </div>
                            <button onclick="abrirModalAdicionarPorta('${cto.id}', '${cto.nome}', '${cto.localizacao}', '${cto.quantidade_portas}')" style="margin-bottom: 15px;">➕ Adicionar Porta</button>
                            <button onclick="abrirModalEditarCTO('${cto.id}', '${cto.localizacao}', '${cto.quantidade_portas}', '${cto.latitude || ''}', '${cto.longitude || ''}')" style="margin-bottom: 15px; background: #f59e0b;">✏️ Editar CTO</button>
                            <button onclick="excluirCTO('${cto.id}')" style="margin-bottom: 15px; background: #ef4444;">🗑️ Excluir CTO</button>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Porta</th>
                                        <th>Status</th>
                                        <th>Cliente</th>
                                        <th>Plano</th>
                                        <th>Observação</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${cto.portas && cto.portas.length > 0 ? cto.portas.map(porta => `
                                        <tr>
                                            <td>${porta.numero}</td>
                                            <td>${porta.status}</td>
                                            <td>${porta.cliente}</td>
                                            <td>${porta.plano}</td>
                                            <td>${porta.observacao}</td>
                                            <td>
                                                <button onclick="abrirModalEditarPorta('${cto.id}', '${cto.nome}', '${cto.localizacao}', '${cto.quantidade_portas}', '${porta.numero}', '${porta.status}', '${porta.cliente}', '${porta.plano}', '${porta.observacao}')" style="background: #f59e0b; padding: 4px 10px; font-size: 0.85em;">✏️</button>
                                                <button onclick="excluirPorta('${cto.id}', '${porta.numero}')" style="background: #ef4444; padding: 4px 10px; font-size: 0.85em; margin-left: 5px;">🗑️</button>
                                            </td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="6" style="text-align: center; color: #94a3b8;">Nenhuma porta adicionada</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar CTOs:', error);
            }

            // Atualizar lista de clientes
            renderizarClientes();
        }

        // ==== Navegação por abas (CTOs / Clientes / Mapa) ====
        const navTabCTOs = document.getElementById("navTabCTOs");
        const navTabClientes = document.getElementById("navTabClientes");
        const navTabMapa = document.getElementById("navTabMapa");
        const secaoCTOs = document.getElementById("secaoCTOs");
        const secaoClientes = document.getElementById("secaoClientes");
        const secaoMapa = document.getElementById("secaoMapa");
        const filtroClientes = document.getElementById("filtroClientes");

        function mostrarAbaCTOs() {
            navTabCTOs.classList.add("active");
            navTabClientes.classList.remove("active");
            navTabMapa.classList.remove("active");
            secaoCTOs.style.display = "block";
            secaoClientes.style.display = "none";
            secaoMapa.style.display = "none";
        }

        function mostrarAbaClientes() {
            navTabClientes.classList.add("active");
            navTabCTOs.classList.remove("active");
            navTabMapa.classList.remove("active");
            secaoClientes.style.display = "block";
            secaoCTOs.style.display = "none";
            secaoMapa.style.display = "none";
        }

        function mostrarAbaMapa() {
            navTabMapa.classList.add("active");
            navTabCTOs.classList.remove("active");
            navTabClientes.classList.remove("active");
            secaoMapa.style.display = "block";
            secaoCTOs.style.display = "none";
            secaoClientes.style.display = "none";
            renderizarMapaPrincipal();
        }

        navTabCTOs.onclick = mostrarAbaCTOs;
        navTabClientes.onclick = mostrarAbaClientes;
        navTabMapa.onclick = mostrarAbaMapa;

        // Renderizar o mapa principal com marcadores de todas as CTOs
        function renderizarMapaPrincipal() {
            if (!mapaPrincipal) {
                mapaPrincipal = L.map('mapaCTOs').setView([-14.235, -51.9253], 4);
                adicionarCamadasBase(mapaPrincipal);
                mapaPrincipalMarkers = L.layerGroup().addTo(mapaPrincipal);
            }

            mapaPrincipalMarkers.clearLayers();

            const comCoordenadas = ctosCache.filter(cto => cto.latitude && cto.longitude);
            const mensagem = document.getElementById("mapaMensagem");
            mensagem.style.display = comCoordenadas.length === 0 ? "block" : "none";

            comCoordenadas.forEach(cto => {
                const lat = parseFloat(cto.latitude);
                const lng = parseFloat(cto.longitude);
                const marker = L.marker([lat, lng]).bindPopup(`
                    <div style="color:#0f172a;">
                        <strong>${cto.nome}</strong><br>
                        📍 ${cto.localizacao}<br>
                        <button onclick="mostrarAbaCTOs(); irParaCTO('${cto.id}')" style="margin-top:6px; padding:4px 10px; font-size:0.8em; background:#3b82f6; color:white; border:none; border-radius:4px; cursor:pointer;">Ver CTO</button>
                    </div>
                `);
                marker.addTo(mapaPrincipalMarkers);
            });

            if (comCoordenadas.length > 0) {
                const grupo = L.featureGroup(comCoordenadas.map(cto => L.marker([parseFloat(cto.latitude), parseFloat(cto.longitude)])));
                mapaPrincipal.fitBounds(grupo.getBounds().pad(0.2));
            }

            setTimeout(() => mapaPrincipal.invalidateSize(), 200);
        }

        // Renderizar lista completa de clientes (com filtro opcional)
        function renderizarClientes() {
            const termo = filtroClientes.value.trim().toLowerCase();
            const container = document.getElementById("listaClientes");

            const encontrados = [];
            ctosCache.forEach(cto => {
                (cto.portas || []).forEach(porta => {
                    if (porta.cliente && porta.cliente !== "-" && (!termo || porta.cliente.toLowerCase().includes(termo))) {
                        encontrados.push({ cto, porta });
                    }
                });
            });

            if (encontrados.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">Nenhum cliente encontrado</p>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>CTO</th>
                            <th>Localização</th>
                            <th>Porta</th>
                            <th>Status</th>
                            <th>Plano</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${encontrados.map(({ cto, porta }) => `
                            <tr>
                                <td>${porta.cliente}</td>
                                <td>${cto.nome}</td>
                                <td>${cto.localizacao}</td>
                                <td>${porta.numero}</td>
                                <td>${porta.status}</td>
                                <td>${porta.plano}</td>
                                <td><button onclick="irParaCTODeCliente('${cto.id}')" style="background: #3b82f6; padding: 6px 14px; font-size: 0.85em;">Ver CTO</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        filtroClientes.oninput = renderizarClientes;

        // Ir para a CTO a partir da aba de clientes
        function irParaCTODeCliente(ctoId) {
            mostrarAbaCTOs();
            irParaCTO(ctoId);
        }

        // Rolar até a CTO na lista principal e destacar
        function irParaCTO(ctoId) {
            const elemento = document.getElementById('cto-' + ctoId);
            if (elemento) {
                elemento.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemento.classList.add('cto-highlight');
                setTimeout(() => elemento.classList.remove('cto-highlight'), 2000);
            }
        }

        // Carregar CTOs ao abrir a página
        carregarCTOs();
    </script>

</body>
</html>
